name: Offline (I10)

# Noyau et dogfood sans réseau : aucun appel sortant toléré.
# Actif dès T0 (garde précoce) ; le dogfood `code` le rend bloquant en T3.8.
on:
  push:
  pull_request:

jobs:
  offline:
    runs-on: self-hosted
    steps:
      - name: Checkout SA
        uses: actions/checkout@v4
        with:
          path: harness-gcn

      - name: Checkout moteur (pinné, cf. docs/engine-compat.md)
        uses: actions/checkout@v4
        with:
          repository: devmail0561-web/gcn_engine
          ref: 20163daea57c0da065e22aa2cdb179ab69ba194a
          path: projet_CNM

      - name: Installer uv
        uses: astral-sh/setup-uv@v5

      - name: Sync dépendances
        working-directory: harness-gcn
        run: uv sync --group dev --frozen

      - name: Suite sous --disable-socket
        working-directory: harness-gcn
        run: uv run pytest -q -p socket --disable-socket

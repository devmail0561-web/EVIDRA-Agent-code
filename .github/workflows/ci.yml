name: CI

on:
  push:
  pull_request:

jobs:
  ci:
    runs-on: self-hosted
    steps:
      - name: Checkout SA
        uses: actions/checkout@v4
        with:
          path: harness-gcn

      - name: Checkout moteur (pinné, cf. docs/engine-compat.md)
        uses: actions/checkout@v4
        with:
          repository: devmail0561-web/gcn_engine
          ref: 2778fb4f037c93dafaa101ff8d8f695492d4a158
          path: projet_CNM

      - name: Installer uv
        uses: astral-sh/setup-uv@v5

      - name: Sync dépendances (+ extras API)
        working-directory: harness-gcn
        run: uv sync --group dev --extra api --extra network --frozen

      - name: Ruff (lint)
        working-directory: harness-gcn
        run: uv run ruff check src tests scripts

      - name: Ruff (format)
        working-directory: harness-gcn
        run: uv run ruff format --check src tests scripts

      - name: Mypy strict (kernel, memory)
        working-directory: harness-gcn
        run: uv run mypy src/evidra/kernel src/evidra/memory

      - name: Garde I1 (import-linter)
        working-directory: harness-gcn
        run: uv run lint-imports

      - name: Garde I2 (noyau < 500 SLOC)
        working-directory: harness-gcn
        run: python3 scripts/sloc.py src/evidra/kernel

      - name: Garde I9 (constantes déclarées)
        working-directory: harness-gcn
        run: python3 scripts/lint_provisoire.py src/evidra

      - name: Tests + couverture
        working-directory: harness-gcn
        run: uv run pytest -q --cov=evidra --cov-report=term-missing

      - name: OpenAPI à jour
        working-directory: harness-gcn
        run: uv run python scripts/exporter_openapi.py --data-dir /tmp/ci-data --directive directives/code.dogfood.json && git diff --exit-code docs/contrats/openapi.json
